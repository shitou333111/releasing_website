name: Deploy To Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-server:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run docs:build
        env:
          BASE_URL: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Remove TTS files before upload (too large, reuse from server)
        run: rm -rf docs/.vitepress/dist/tts

      - name: Upload dist to server tmp path
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docs/.vitepress/dist/*
          target: /tmp/releasing_website-deploy
          overwrite: true
          strip_components: 3

      - name: Atomic deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.SSH_TARGET_DIR }}"
            RELEASES_DIR="${TARGET_DIR}/.releases"
            RELEASE_DIR="${RELEASES_DIR}/release-${{ github.run_id }}-${{ github.run_attempt }}"
            mkdir -p "$RELEASE_DIR"
            cp -a /tmp/releasing_website-deploy/. "$RELEASE_DIR/"
            PREVIOUS_RELEASE=$(readlink -f "${TARGET_DIR}/current" 2>/dev/null || echo "")
            if [ -n "$PREVIOUS_RELEASE" ] && [ -d "${PREVIOUS_RELEASE}/tts" ]; then
              echo "Reusing TTS files from previous release: ${PREVIOUS_RELEASE}/tts"
              cp -a "${PREVIOUS_RELEASE}/tts" "$RELEASE_DIR/"
            fi
            ln -sfn "$RELEASE_DIR" "${TARGET_DIR}/current"
            ls -1dt "${RELEASES_DIR}"/release-* 2>/dev/null | tail -n +6 | xargs -r rm -rf
